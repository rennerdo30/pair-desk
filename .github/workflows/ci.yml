name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests (failed tests retried, 3 attempts in total)
        run: python scripts/run-unit-tests.py --attempts 3
      - name: Topic transfer dialog checks
        run: node scripts/test-transfer.mjs
      - name: Smoke test (real server process)
        run: python scripts/smoke.py
      - name: Launcher (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          sh -n bin/pair-desk
          sh -n install.sh
          bin/pair-desk --version
      - name: Launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: bin\pair-desk.cmd --version
      - name: Installer dry run
        run: python desk.py install --dry-run --no-link

  package:
    name: wheel builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the wheel and run the console script from it
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/pair-desk --version
          /tmp/venv/bin/pair-desk install --dry-run --no-link
